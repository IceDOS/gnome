[icedos.desktop.gnome]
excludeDefaultPackages = []
hotCorners = false
powerButtonAction = "interactive"

[icedos.desktop.gnome.extensions]
arcmenu = false
dashToPanel = false

[icedos.desktop.gnome.workspaces]
dynamicWorkspaces = true
maxWorkspaces = 1 # Determines the maximum number of workspaces when dynamic workspaces are disabled

[icedos.desktop.gnome.slideshow]
images = [] # Absolute paths; empty = no slideshow
durationSeconds = 1800 # Per-image hold time
transitionSeconds = 5 # Crossfade duration

[icedos.desktop.users.username.gnome.pinnedApps.arcmenu]
enable = false
list = []

# Set pinned apps for gnome shell (will be used by dash-to-panel if enabled)
[icedos.desktop.users.username.gnome.pinnedApps.shell]
enable = false
list = []
